- title: "New paper! Can AI minds help understand mental health?"
  date: 2025-01-17
  image: 9bdb64_ab34e614c9a94440af3f8e5b6c839d81~mv2.png
  note: Wix title was a full LinkedIn post; shortened here. Original title text kept in body's first paragraph.
  body: |
    We propose using generative agents to simulate how environment & social factors impact mental health. Think virtual cities with AI citizens to study what shapes wellbeing. Read more: https://www.nature.com/articles/s41746-024-01422-z

    Can artificial minds help us understand determinants of mental health? Excited to share our new paper in npj Digital Medicine with Andreas Meyer-Lindenberg!

    **Real World Example:** Picture a person navigating a busy city - their mental wellbeing shaped by countless factors from noise levels to social interactions. Traditional research can only scratch the surface of these complex dynamics.

    **Technical Innovation:** We propose using generative agents (Park et al.) - AI entities powered by Large Language Models (LLMs) - to simulate human behavior in virtual environments in order to investigate determinants of mental health.

    **Technical Architecture:** The innovation lies in how these agents combine: memory systems that store past experiences; the ability to process environmental cues; realistic social interactions; capacity to report mental health symptoms. This allows researchers to study how different factors interact over time in ways that would be impossible in real-world studies.

    **Why This Matters:** This could offer a new approach to how we study mental health by:
    - Enabling controlled experiments impossible in real life
    - Accelerating intervention development
    - Informing urban planning for better mental health
    - Advancing precision psychiatry

