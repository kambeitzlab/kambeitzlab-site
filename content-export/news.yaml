- title: PhD Position in Computational Neurosciences / Translational Clinical Neurosciences
  date: 2021-04-21
  image: 9bdb64_4d4de14b18b24a16b53617f4946144e5~mv2.jpg
  note: position long filled - consider dropping
  body: |
    We have an open PhD position @kambeitzlab in cooperation with the Forschungszentrum Jülich, Institute of Neuroscience and Medicine - Cognitive Neuroscience (INM-3) in the area Computational Neurosciences / Translational Clinical Neurosciences. The scope of the research is the investigation of neurobiological mechanisms underlying brain dynamics using multimodal neuroimaging data and computational neurosciences approaches, more specifically the changes of brain dynamics in the context of psychological or neurological disorders, as well as the relationship to risk- and resilience-factors. More information: https://www.fz-juelich.de/SharedDocs/Stellenangebote/_common/dna/2021D-053-EN-INM-3.html
