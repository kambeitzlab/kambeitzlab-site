# Alternative to GitHub Pages. Netlify builds from the repo; preview URLs are
# https://<site-name>.netlify.app (plus per-PR deploy previews).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set SITE_URL to https://kambeitzlab.com in the Netlify UI only once the domain points here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=(), camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
